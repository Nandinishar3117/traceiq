version: '3.8'

services:
  # 1. PostgreSQL Relational Store
  postgres:
    image: postgres:15-alpine
    container_name: traceiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-traceiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/postgres/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traceiq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traceiq-net

  # 2. Elasticsearch Full-Text Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: traceiq-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 6
    networks:
      - traceiq-net

  # 3. Python FastAPI Analytics & AI Debugging Service
  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: traceiq-analytics
    restart: unless-stopped
    environment:
      - ANALYTICS_HOST=0.0.0.0
      - ANALYTICS_PORT=8000
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - traceiq-net

  # 4. Node.js Express API Gateway & Ingestion Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: traceiq-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_DATABASE=${POSTGRES_DB:-traceiq}
      - PG_USER=${POSTGRES_USER:-postgres}
      - PG_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=traceiq-logs
      - ANALYTICS_SERVICE_URL=http://analytics:8000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - traceiq-net

  # 5. React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceiq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - traceiq-net

networks:
  traceiq-net:
    driver: bridge

volumes:
  pg_data:
    driver: local
  es_data:
    driver: local
